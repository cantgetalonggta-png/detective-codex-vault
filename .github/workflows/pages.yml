name: Pages note
on:
  push:
    branches: [main]
  workflow_dispatch:
# Pages is published from branch `main` (Deploy from a branch).
# Do NOT call actions/deploy-pages here — that API 404s unless
# Settings → Pages → Source is set to GitHub Actions.
jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "GitHub Pages source must be: Deploy from a branch → main → / (root) or /docs"
          echo "Custom actions/deploy-pages is disabled so it cannot overwrite branch Pages."
