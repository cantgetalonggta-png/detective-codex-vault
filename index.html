<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Investigation Book — User Vault</title>
<style>
:root{--bg:#e8e0d4;--page:#faf6ef;--ink:#1f1a14;--muted:#5a5044;--line:#d4c8b6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{background:#ddd4c6;border-right:1px solid #c0b4a0;padding:1rem .85rem 2rem;overflow:auto;position:sticky;top:0;height:100vh}
aside h1{font-size:1.05rem;margin:.2rem 0 .6rem}
aside input{width:100%;padding:.45rem .55rem;border:1px solid #c0b4a0;background:#faf6ef;font:inherit;margin-bottom:.8rem}
.part{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#7a6b58;margin:.75rem 0 .25rem}
aside button{display:block;width:100%;text-align:left;background:0;border:0;padding:.35rem .4rem;font:inherit;cursor:pointer;border-radius:3px}
aside button:hover,aside button.active{background:#cfc4b2}
main{padding:1.2rem 1.5rem 3rem;max-width:960px}
.pager{display:flex;gap:.6rem;align-items:center;margin-bottom:.8rem;font-family:system-ui;font-size:.9rem;color:var(--muted)}
.pager button{padding:.4rem .8rem;border:1px solid #c0b4a0;background:#faf6ef;cursor:pointer;font:inherit}
.book{background:var(--page);border:1px solid #c9bba8;box-shadow:0 8px 28px rgba(40,30,15,.12);padding:2rem 2.2rem;min-height:70vh;line-height:1.7}
.book h2{font-size:1.45rem;margin:.2rem 0 .6rem}.book h3{font-size:1.1rem;margin:1rem 0 .3rem}
.lede{font-size:1.08rem;color:#3a3228}.small{font-size:.92rem;color:var(--muted);font-family:system-ui}
.tag{display:inline-block;font-family:system-ui;font-size:.72rem;padding:2px 8px;border:1px solid #c9bba8;background:#efe8dc;margin:0 .3rem .2rem 0}
.tag.yes{background:#d8f0d8}.tag.maybe{background:#fff3cd}.tag.no{background:#f5d6d6}
.card{border-top:1px solid var(--line);padding:.7rem 0}
.card.spin{border:1px solid var(--line);padding:.9rem 1rem;margin:.8rem 0;background:#fffdf8}
.cover{text-align:center;padding:3rem 1rem;background:linear-gradient(165deg,#2c241c,#0f0c09);color:#f0e6d6}
.cover h1{color:#f5ead8;font-size:2.2rem;margin:.4rem 0}
.kicker{letter-spacing:.2em;text-transform:uppercase;font-size:.78rem;color:#a89070}
.rule{width:80px;height:1px;background:#a89070;margin:1rem auto}
.foot{margin-top:1rem;font-family:system-ui;font-size:.78rem;color:var(--muted)}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:relative;height:auto}}
</style>
</head>
<body>
<div class="app">
<aside>
<h1>Investigation Book</h1>
<input id="q" placeholder="Search book…" oninput="renderNav()"/>
<div id="nav"></div>
</aside>
<main>
<div class="pager"><button type="button" onclick="go(-1)">← Prev</button><span id="pos"></span><button type="button" onclick="go(1)">Next →</button></div>
<div class="book" id="page">Opening vault…</div>
<div class="foot">v6 book · no login · vault only · PBP contradicted · MAYBE ≠ fact</div>
</main>
</div>
<script src="book.js"></script>
</body>
</html>
