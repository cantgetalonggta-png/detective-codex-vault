<!DOCTYPE html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Investigation Book</title><style>:root{--bg:#e8e0d4;--page:#faf6ef;--ink:#1f1a14;--muted:#5a5044;--line:#d4c8b6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}aside{background:#ddd4c6;border-right:1px solid #c0b4a0;padding:1rem;overflow:auto;position:sticky;top:0;height:100vh}aside h1{font-size:1.05rem}aside input{width:100%;padding:.4rem;margin:.5rem 0;border:1px solid #c0b4a0;background:#faf6ef}.part{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#7a6b58;margin:.7rem 0 .2rem}aside button{display:block;width:100%;text-align:left;border:0;background:0;padding:.35rem;font:inherit;cursor:pointer}aside button.active,aside button:hover{background:#cfc4b2}main{padding:1.2rem 1.5rem;max-width:920px}.pager{display:flex;gap:.6rem;align-items:center;margin-bottom:.8rem;font-family:system-ui;font-size:.9rem;color:var(--muted)}.pager button{padding:.4rem .8rem;border:1px solid #c0b4a0;background:#faf6ef}.book{background:var(--page);border:1px solid #c9bba8;padding:2rem;min-height:70vh;line-height:1.7}.tag{display:inline-block;font-family:system-ui;font-size:.72rem;padding:2px 8px;border:1px solid #c9bba8;background:#efe8dc;margin-right:.3rem}.tag.yes{background:#d8f0d8}.tag.maybe{background:#fff3cd}.tag.no{background:#f5d6d6}.card{border-top:1px solid var(--line);padding:.7rem 0}.spin{border:1px solid var(--line);padding:.9rem;margin:.8rem 0;background:#fffdf8}.cover{text-align:center;padding:3rem 1rem;background:#1a1510;color:#f0e6d6}.foot{margin-top:1rem;font-family:system-ui;font-size:.78rem;color:var(--muted)}</style></head><body><div class=app><aside><h1>Investigation Book</h1><input id=q placeholder="Search…" oninput=renderNav()><div id=nav></div></aside><main><div class=pager><button onclick=go(-1)>← Prev</button><span id=pos></span><button onclick=go(1)>Next →</button></div><div class=book id=page>Loading vault…</div><div class=foot>v5.1 · no login · PBP contradicted</div></main></div><script src=book.js></script></body></html>
